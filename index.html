<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Planner — FPL Squad &amp; Fixture Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Fantasy Planner</h1>
    <span id="data-freshness" class="data-freshness"></span>
    <span id="version-badge" class="version-badge"></span>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="tab-squad">Squad Builder</button>
      <button class="tab-btn" data-tab="tab-bestxi">Best XI</button>
      <button class="tab-btn" data-tab="tab-fixtures">Fixtures</button>
    </nav>
  </header>

  <main>
    <!-- Squad Builder -->
    <section id="tab-squad" class="tab-panel active">
      <div id="budget-bar" class="budget-bar"></div>
      <div id="squad-status" class="squad-status"></div>
      <div id="squad-slots" class="squad-slots"></div>

      <h2>Players</h2>
      <div class="filter-bar">
        <input type="search" id="filter-search" placeholder="Search players…">
        <select id="filter-position">
          <option value="0">All positions</option>
          <option value="1">Goalkeepers</option>
          <option value="2">Defenders</option>
          <option value="3">Midfielders</option>
          <option value="4">Forwards</option>
        </select>
        <select id="filter-team"></select>
        <select id="filter-sort">
          <option value="total_points">Sort: Total points</option>
          <option value="now_cost">Sort: Price</option>
          <option value="form">Sort: Form</option>
          <option value="points_per_game">Sort: Points/game</option>
          <option value="xgi">Sort: xGI</option>
          <option value="ict_index">Sort: ICT index</option>
          <option value="selected">Sort: Ownership %</option>
          <option value="value">Sort: Points per £m</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Player</th><th>Club</th><th>Pos</th><th>Price</th><th>Pts</th>
              <th>PPG</th><th>Form</th><th>xGI</th><th>ICT</th><th>Own%</th>
            </tr>
          </thead>
          <tbody id="player-rows"></tbody>
        </table>
      </div>
      <p class="hint">Click a row to add or remove a player. Showing top 100 by current sort. Stats are last season's until GW1 kicks off.</p>
    </section>

    <!-- Best XI -->
    <section id="tab-bestxi" class="tab-panel">
      <div class="filter-bar">
        <label for="bestxi-gw-select">Gameweek:</label>
        <select id="bestxi-gw-select"></select>
      </div>
      <div id="bestxi-result"></div>
    </section>

    <!-- Fixtures -->
    <section id="tab-fixtures" class="tab-panel">
      <h2>Season ticker</h2>
      <p class="hint">FDR colours: green = easier, red = harder. * = away. – = blank gameweek.</p>
      <div class="ticker-wrap">
        <table id="fixture-ticker" class="ticker-table"></table>
      </div>

      <h2>Gameweek detail</h2>
      <div class="filter-bar">
        <label for="fixtures-gw-select">Gameweek:</label>
        <select id="fixtures-gw-select"></select>
      </div>
      <div id="fixtures-gw-list" class="gw-list"></div>
    </section>
  </main>

  <script src="data/meta.js"></script>
  <script src="data/teams.js"></script>
  <script src="data/events.js"></script>
  <script src="data/players.js"></script>
  <script src="data/fixtures.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/fixtures.js"></script>
  <script src="js/app.js"></script>
  <script src="js/version.js"></script>
</body>
</html>
